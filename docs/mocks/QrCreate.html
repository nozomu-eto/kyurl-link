<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #f7f5f0; overflow: hidden;"><header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: #ffffff; box-shadow: 0 1px 0 #e3dfd5, 0 2px 6px rgba(20, 30, 50, 0.05);"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #254673;"><span style="font-family: 'Barlow', sans-serif; font-size: 20px; font-weight: 700;">kyurl.link</span></a><div style="display: flex; align-items: center; gap: 16px; font-size: 14px;"><span style="color: #5a5a5a;">owner@example-cafe.jp</span><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 36px; padding: 0 14px; font-size: 13px; background: #ffffff; color: #222222; border: 1px solid #8a8478; ">ログアウト</button></div></header><div style="flex-grow: 1; display: flex;"><nav aria-label="メインメニュー" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; background: #ffffff; border-right: 1px solid #e3dfd5; display: flex; flex-direction: column; gap: 4px;"><a href="Dashboard.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 4px; text-decoration: none; font-size: 15px; background: transparent; color: #333333; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b665c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>短縮URL</a><a href="QrList.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; a-hidden="true"><path d="M9 5l7 7-7 7"></path></svg><span aria-current="page">QRコードを作成</span></nav><h1 style="margin: 0; font-size: 26px; font-weight: 700;">QRコードを作成</h1></div><section style="background: #ffffff; border-radius: 4px; box-shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 2px 8px rgba(20, 30, 50, 0.05); padding: 24px 28px; "><div style="display: flex; flex-direction: column; gap: 24px; max-width: 720px;"><fieldset style="border: none; margin: 0; padding: 0;"><legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 10px;">QRコードの読み取り先</legend><div style="display: flex; gap: 12px;"><label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid #8a8478; background: #ffffff; border-radius: 4px; cursor: pointer; flex: 1 1 0;"><input type="radio" name="qc-target" style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #2f5a93;"><span style="display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;">作成済みの短縮URL<span style="padding: 1px 8px; border-radius: 10px; background: #e8f4ee; color: #1f7a4d; font-size: 12px;">おすすめ</span></span><span style="font-size: 13px; line-height: 1.6; color: #4a4a4a;">印刷後も転送先を変えられ、読み取り数も確認できます。</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 2px solid #2f5a93; background: #eaeef4; border-radius: 4px; cursor: pointer; flex: 1 1 0;"><input type="radio" name="qc-target" checked style="width: 18px; height: 18px; margin: 2px 0 0; accent-color: #2f5a93;"><span style="display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;">URLを直接指定</span><span style="font-size: 13px; line-height: 1.6; color: #4a4a4a;">短縮せず、元のURLをそのままQRコードにします。</span></span></label></div></fieldset><div style="display: flex; flex-direction: column; gap: 6px;"><label for="qc-url" style="font-size: 14px; font-weight: 700;">読み取り先のURL</label><input id="qc-url" type="url" value="https://www.example-cafe.jp/access" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 15px; font-family: inherit; background: #ffffff; font-size: 16px;"></div><div role="note" style="display: flex; gap: 12px; padding: 14px 16px; background: #fdf1dc; border: 1px solid #ecd3a4; border-radius: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a4a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.5 20h19z"></path><path d="M12 10v4.5"></path><path d="M12 17.5v.5"></path></svg><div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.7; color: #5c3800;"><span style="font-weight: 700;">このQRコードは、印刷後に読み取り先を変更できません</span><span>読み取り数の確認もできません。ページのURLが変わる可能性がある場合は、短縮URLを作ってからQRコードにするのがおすすめです。</span><a href="LinkCreate.html" style="align-self: flex-start; font-weight: 700; color: #5c3800;">短縮URLを作成する</a></div></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="qc-name" style="font-size: 14px; font-weight: 700;">名前(管理用)<span style="margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #ebe8e1; color: #4d4a44; font-size: 12px; font-weight: 700;">任意</span></label><input id="qc-name" type="text" placeholder="例:入口の案内用" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 15px; font-family: inherit; background: #ffffff; font-size: 16px; max-width: 420px;"><span style="font-size: 13px; color: #5a5a5a;">未入力の場合は作成日で表示します。</span></div><div style="display: flex; gap: 12px;"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 52px; padding: 0 28px; font-size: 16px; background: #2f5a93; color: #ffffff; border: 1px solid #2f5a93; ">QRコードを作成</button><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 52px; padding: 0 16px; font-size: 15px; background: transparent; color: #2f5a93; border: 1px solid transparent; ">キャンセル</a></div></div></section></main></div></div>
