<!doctype html>

<title>QRコードの作成(スマホ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Barlow:wght@600;700&amp;display=swap" rel="stylesheet">

body{margin:0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',Meiryo,sans-serif;color:#222222;background:#f7f5f0}

<body>

<div style="width: 390px; height: 1060px; position: relative; display: flex; flex-direction: column; background: #f7f5f0; overflow: hidden;"><header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; background: #ffffff; box-shadow: 0 1px 0 #e3dfd5;"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #254673;"><span style="font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 700;">kyurl.link</span></a><button type="button" aria-label="メニューを開く" aria-expanded="false" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button></header><main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 120px;"><div><nav aria-label="パンくずリスト" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5a5a5a; margin-bottom: 12px;"><a href="#" style="color: #2f5a93;">QRコード一覧</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8478" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg><span aria-current="page">QRコードを作成</span></nav><h1 style="margin: 0; font-size: 22px; font-weight: 700;">QRコードを作成</h1></div><fieldset style="border: none; margin: 0; padding: 0;"><legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 10px;">QRコードの読み取り先</legend><div style="display: flex; flex-direction: column; gap: 10px;"><label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid #8a8478; background: #ffffff; border-radius: 4px;"><input type="radio" name="mqc" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #2f5a93; flex-shrink: 0;"><span style="display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;">作成済みの短縮URL<span style="padding: 1px 8px; border-radius: 10px; background: #e8f4ee; color: #1f7a4d; font-size: 12px;">おすすめ</span></span><span style="font-size: 13px; line-height: 1.6; color: #4a4a4a;">印刷後も転送先を変えられ、読み取り数も確認できます。</span></span></label><label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 2px solid #2f5a93; background: #eaeef4; border-radius: 4px;"><input type="radio" name="mqc" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #2f5a93; flex-shrink: 0;"><span style="display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700;">URLを直接指定</span><span style="font-size: 13px; line-height: 1.6; color: #4a4a4a;">短縮せず、元のURLをそのままQRコードにします。</span></span></label></div></fieldset><div style="display: flex; flex-direction: column; gap: 6px;"><label for="mqc-url" style="font-size: 14px; font-weight: 700;">読み取り先のURL</label><input id="mqc-url" type="url" value="https://www.example-cafe.jp/access" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff; width: 100%;"></div><div role="note" style="display: flex; gap: 10px; padding: 14px; background: #fdf1dc; border: 1px solid #ecd3a4; border-radius: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a4a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.5 20h19z"></path><path d="M12 10v4.5"></path><path d="M12 17.5v.5"></path></svg><div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.7; color: #5c3800;"><span style="font-weight: 700;">印刷後に読み取り先を変更できません</span><span>読み取り数の確認もできません。ページのURLが変わる可能性がある場合は、短縮URLを作ってからQRコードにするのがおすすめです。</span><a href="LinkCreate.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #5c3800;">短縮URLを作成する</a></div></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="mqc-name" style="font-size: 14px; font-weight: 700;">名前(管理用)<span style="margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #ebe8e1; color: #4d4a44; font-size: 12px; font-weight: 700;">任意</span></label><input id="mqc-name" type="text" placeholder="例:入口の案内用" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff; width: 100%;"><span style="font-size: 13px; color: #5a5a5a;">未入力の場合は作成日で表示します。</span></div></main><div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: #ffffff; box-shadow: 0 -1px 0 #e3dfd5, 0 -4px 12px rgba(20,30,50,0.06);"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 52px; padding: 0 16px; font-size: 16px; background: #2f5a93; color: #ffffff; border: 1px solid #2f5a93; width: 100%;">QRコードを作成</button></div></div>
</body>
</html>
