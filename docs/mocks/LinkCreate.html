<div style="width: 1440px; height: 960px; display: flex; flex-direction: column; background: #f7f5f0; overflow: hidden;"><header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: #ffffff; box-shadow: 0 1px 0 #e3dfd5, 0 2px 6px rgba(20, 30, 50, 0.05);"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #254673;"><span style="font-family: 'Barlow', sans-serif; font-size: 20px; font-weight: 700;">kyurl.link</span></a><div style="display: flex; align-items: center; gap: 16px; font-size: 14px;"><span style="color: #5a5a5a;">owner@example-cafe.jp</span><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 36px; padding: 0 14px; font-size: 13px; background: #ffffff; color: #222222; border: 1px solid #8a8478; ">ログアウト</button></div></header><div style="flex-grow: 1; display: flex;"><nav aria-label="メインメニュー" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; background: #ffffff; border-right: 1px solid #e3dfd5; display: flex; flex-direction: column; gap: 4px;"><a href="Dashboard.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 4px; text-decoration: none; font-size: 15px; background: #eaeef4; color: #254673; font-weight: 700;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f5a93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>短縮URL</a><a href="QrList.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 4px; text-decoration: none; font-size: 15px; background: transparent; color: #333333; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b665c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2"></path><path d="M20 14v6h-6"></path></svg>QRコード</a><a href="PosterList.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 4px; text-decoration: none; font-size: 15px; background: transparent; color: #333333; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b665c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="1"></rect><path d="M9 7h6"></path><rect x="9.5" y="11" width="5" height="5"></rect></svg>掲示物</a><a href="AccountSettings.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 4px; text-decoration: none; font-size: 15px; background: transparent; color: #333333; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b665c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>アカウント設定</a></nav><main style="flex-grow: 1; box-sizing: border-box; padding: 32px 48px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1200px;"><div><nav aria-label="パンくずリスト" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5a5a5a; margin-bottom: 12px;"><a href="#" style="color: #2f5a93;">短縮URL一覧</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8478" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg><span aria-current="page">短縮URLを作成</span></nav><h1 style="margin: 0; font-size: 26px; font-weight: 700;">短縮URLを作成</h1></div><section style="background: #ffffff; border-radius: 4px; box-shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 2px 8px rgba(20, 30, 50, 0.05); padding: 24px 28px; "><div style="display: flex; flex-direction: column; gap: 24px; max-width: 640px;"><div style="display: flex; flex-direction: column; gap: 6px;"><label for="lc-url" style="font-size: 14px; font-weight: 700;">案内したいページのURL<span style="margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #faecea; color: #b13528; font-size: 12px; font-weight: 700;">必須</span></label><input id="lc-url" type="url" placeholder="https://" value="https://www.example-cafe.jp/menu/autumn-2026" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff;"><span style="font-size: 13px; color: #5a5a5a; line-height: 1.6;">お店のホームページ、予約ページ、SNSのページなどのURLを貼り付けてください。</span></div><fieldset style="border: none; margin: 0; padding: 0;"><legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 10px;">有効期限</legend><div style="display: flex; gap: 10px;"><button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; flex: 1 1 0; height: 44px; font-size: 15px; background: #eaeef4; color: #254673; border: 2px solid #2f5a93;">無期限</button><button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; flex: 1 1 0; height: 44px; font-size: 15px; background: #ffffff; color: #222222; border: 1px solid #8a8478;">1か月後</button><button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; flex: 1 1 0; height: 44px; font-size: 15px; background: #ffffff; color: #222222; border: 1px solid #8a8478;">3か月後</button><button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; flex: 1 1 0; height: 44px; font-size: 15px; background: #ffffff; color: #222222; border: 1px solid #8a8478;">日付を指定</button></div><span style="font-size: 13px; color: #5a5a5a; line-height: 1.6;">キャンペーンなど終わりが決まっている場合に設定します。あとから変更・延長もできます。</span></fieldset><div style="padding: 16px; border: 1px solid #e3dfd5; border-radius: 4px; display: flex; flex-direction: column; gap: 14px;"><label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; font-weight: 700; cursor: pointer;"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #2f5a93;">QRコードも一緒に作成する</label><div style="display: flex; flex-direction: column; gap: 6px;"><label for="lc-qrname" style="font-size: 14px; font-weight: 700;">QRコードの名前(管理用)<span style="margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #ebe8e1; color: #4d4a44; font-size: 12px; font-weight: 700;">任意</span></label><input id="lc-qrname" type="text" placeholder="例:店頭ポスター用" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff;"><span style="font-size: 13px; color: #5a5a5a; line-height: 1.6;">一覧で見分けるための名前です。未入力の場合は作成日で表示します。</span></div></div><div style="display: flex; gap: 12px;"><button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 52px; padding: 0 28px; font-size: 16px; background: #d03e2f; color: #ffffff; border: 1px solid #d03e2f; ">短縮URLを作成</button><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; height: 52px; padding: 0 16px; font-size: 15px; background: transparent; color: #2f5a93; border: 1px solid transparent; ">キャンセル</a></div></div></section></main></div></div>
