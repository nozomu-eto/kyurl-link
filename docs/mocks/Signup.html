<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サインアップ(スマホ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Barlow:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',Meiryo,sans-serif;color:#222222;background:#f7f5f0}
a{color:#2f5a93}a:hover{color:#254673}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!-- kyurl.link 画面モック(見た目の基準。実装コードではない)。docs/mocks/README.md を参照 -->

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f7f5f0;"><header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 20px; background: #ffffff; border-bottom: 1px solid #e3dfd5;"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #254673;"><span style="font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 700;">kyurl.link</span></a></header><main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 32px 24px 24px;"><div><h1 style="margin: 0; font-size: 24px; font-weight: 700;">無料で新規登録</h1><p style="margin: 6px 0 0; font-size: 14px; line-height: 1.7; color: #4a4a4a;">メールアドレスとパスワードだけで始められます。</p></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="su-email" style="font-size: 14px; font-weight: 700;">メールアドレス</label><input id="su-email" type="email" autocomplete="email" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff; width: 100%;"></div><div style="display: flex; flex-direction: column; gap: 6px;"><label for="su-pw" style="font-size: 14px; font-weight: 700;">パスワード</label><input id="su-pw" type="password" autocomplete="new-password" aria-describedby="su-pw-hint" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a8478; border-radius: 4px; font-size: 16px; font-family: inherit; background: #ffffff; width: 100%;"><span id="su-pw-hint" style="font-size: 13px; color: #5a5a5a;">8文字以上で入力してください</span></div><div style="padding: 14px 16px; background: #ffffff; border: 1px solid #e3dfd5; border-radius: 4px; display: flex; flex-direction: column; gap: 0;"><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 700; cursor: pointer;"><input type="checkbox" id="su-agree" style="width: 22px; height: 22px; margin: 0; accent-color: #2f5a93; flex-shrink: 0;"><span><a href="#" target="_blank" rel="noopener">利用規約</a>と<a href="#" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します</span></label></div><div style="display: flex; flex-direction: column; gap: 8px;"><button type="submit" id="su-submit" disabled aria-describedby="su-note" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border-radius: 4px; font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; width: 100%; height: 52px; font-size: 16px; border: 1px solid #d03e2f; background: #d03e2f; color: #ffffff; opacity: 0.45; cursor: not-allowed;">登録する</button><span id="su-note" style="font-size: 13px; color: #5a5a5a; text-align: center;">同意にチェックを入れると登録できます</span></div><p style="margin: auto 0 0; text-align: center; font-size: 14px;">すでにアカウントをお持ちの方は<a href="#" style="font-weight: 700;">ログイン</a></p></main></div>
<script>
// モック用:同意のチェックに応じて登録ボタンの状態と説明文を切り替える(実装コードではない)
const agree=document.getElementById('su-agree'),submit=document.getElementById('su-submit'),note=document.getElementById('su-note');
agree.addEventListener('change',()=>{submit.disabled=!agree.checked;submit.style.opacity=agree.checked?'1':'0.45';submit.style.cursor=agree.checked?'pointer':'not-allowed';note.textContent=agree.checked?'確認メールを送信します':'同意にチェックを入れると登録できます';});
</script>
</body>
</html>
